############################################ 基础配置
server:
  port: 10001
  servlet:
    context-path: /ddd-jdk8

spring:
  datasource:
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
      username: root
      password: 123456
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: Retail_HikariCP
        #最小空闲连接数量
        minimum-idle: 15
        #空闲连接存活最大时间，默认600000（10分钟）
        idle-timeout: 180000
        #连接池最大连接数，默认是10
        maximum-pool-size: 25
        #控制从池返回的连接的默认自动提交行为,默认值：true
        auto-commit: true
        #控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
        max-lifetime: 1800000
        #数据库连接超时时间,默认30秒，即30000
        connection-timeout: 30000
        connection-test-query: SELECT 1


############################################ 线程池配置
thread-pool:
  executor:
    # 事件异步处理线程池配置
    event-async:
      core-pool-size: 10
      max-pool-size: 20
      queue-capacity: 100
      thread-name-prefix: Event-Async-

    # 业务线程池配置
    xxx:
      core-pool-size: 20
      max-pool-size: 50
      keep-alive-time-sec: 5000
      block-queue-size: 5000
      policy: CallerRunsPolicy
      thread-name-prefix: Chat-Message_Send-

############################################ redis配置
redis:
  sdk:
    config:
      host: localhost
      port: 16379
      # password: 123456
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

############################################ xxl-job 配置
xxl.job:
  admin.addresses: http://localhost:18080/xxl-job-admin
  ### 执行器通讯TOKEN [选填]：非空时启用；
  accessToken:
  executor:
    ### 执行器AppName [选填]：执行器心跳注册分组依据；为空则关闭自动注册
    appname: ddd-jdk8
    ### 执行器注册 [选填]：优先使用该配置作为注册地址，为空时使用内嵌服务 ”IP:PORT“ 作为注册地址。从而更灵活的支持容器类型执行器动态IP和动态映射端口问题。
    address:
    ### 执行器IP [选填]：默认为空表示自动获取IP，多网卡时可手动设置指定IP，该IP不会绑定Host仅作为通讯实用；地址信息用于 "执行器注册" 和 "调度中心请求并触发任务"；
    ip:
    ### 执行器端口号 [选填]：小于等于0则自动获取；默认端口为9999，单机部署多个执行器时，注意要配置不同执行器端口；
    port: 19001
    ### 执行器运行日志文件存储磁盘路径 [选填] ：需要对该路径拥有读写权限；为空则使用默认路径；
    logpath: /qiezhichao/appsoft/ddd-jdk8/logs/xxl-job
    ### 执行器日志文件保存天数 [选填] ： 过期日志自动清理, 限制值大于等于3时生效; 否则, 如-1, 关闭自动清理功能；
    logretentiondays: 7